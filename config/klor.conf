# --- KLOR (polydactyl) configuration ---

# Rotary encoders (EC11)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Mouse / pointing — smart-mouse combo + mouse layer (urob's mouse.dtsi)
CONFIG_ZMK_POINTING=y

# OLED display (KLOR's SSD1306, ZMK default status screen)
CONFIG_ZMK_DISPLAY=y

# Power management. Deep sleep is DISABLED on purpose: this build is wall-powered
# (left = USB, right = powered from the left over TRRS), so there is no battery to
# conserve. With sleep enabled, the idle left half powers down its rails and cuts
# the TRRS power feeding the right half, which then drops off until the left is
# power-cycled. Keeping it awake keeps the right half alive.
# (If you ever switch to battery/wireless, re-enable these.)
CONFIG_ZMK_SLEEP=n
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Bluetooth tweaks (from urob)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Per-key RGB (21 SK6812 Mini-E per half; strip defined in
# boards/shields/klor/boards/nice_nano_nrf52840_zmk.overlay). Controls are on
# the SYS layer. Settings changed with those keys are saved on the keyboard.
CONFIG_ZMK_RGB_UNDERGLOW=y
# Don't cut the switched VCC rail when the LEDs are toggled off: it also powers
# the OLEDs and (over TRRS) the right half -- see the sleep note above.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
# The left nice!nano's regulator feeds both halves' LEDs plus the right half,
# so cap brightness. Raise with care.
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=50
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=25
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=40
